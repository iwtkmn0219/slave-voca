name: ci

on:
  pull_request:
  push:
    branches: [main, development]

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # data/awl.json은 저장소에 없다(라이선스). AWL 테스트 2개는 건너뛴다.
      - run: npm test
      - run: npm run build
